services:
  postgres:
    image: postgres:17-alpine
    container_name: sprm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: property_rental
      POSTGRES_USER: property_app
      POSTGRES_PASSWORD: property_app_dev
    ports:
      - '5432:5432'
    volumes:
      - property_rental_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U property_app -d property_rental']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  property_rental_data:
